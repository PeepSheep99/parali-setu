<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e1f33">
<title>Parali Setu · Book a pickup</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Baloo+Paaji+2:wght@500;600;700&family=Hind:wght@400;500;600&family=Mukta+Mahee:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="kisan.css">
</head>
<body>

<header class="bar">
  <a class="brand" href="../">
    <img src="icon.svg" alt="" width="32" height="32">
    <span class="brand-name">Parali Setu</span>
  </a>
  <div class="bar-right">
    <div class="langs" role="group" aria-label="Language (optional: we follow the language you speak)">
      <button type="button" data-lang="pa" lang="pa">ਪੰਜਾਬੀ</button>
      <button type="button" data-lang="hi" lang="hi">हिंदी</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button type="button" id="open-pickups" class="btn quiet small"><span data-t="my_pickups"></span><span id="pickup-count" class="count" hidden></span></button>
  </div>
</header>
<div class="bagh-band" aria-hidden="true"></div>
<p class="demo-strip" data-t="demo_banner"></p>

<main class="page">
  <section class="talk" aria-label="Talk to Parali Setu">
    <div id="log" class="log" aria-live="polite"></div>

    <div class="dock">
      <form id="kbd" class="composer">
        <label class="round" for="talk-photo" title="Photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
          <span class="sr" data-t="add_photo"></span>
          <input type="file" id="talk-photo" accept="image/*" capture="environment" hidden>
        </label>
        <button type="button" id="talk-locate" class="round" title="Location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span class="sr" data-t="detect_location"></span>
        </button>
        <label class="sr" for="kbd-input" data-t="type_label"></label>
        <input id="kbd-input" type="text" maxlength="600" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg></button>
        <button type="button" id="talk-mic" class="mic" aria-describedby="talk-label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg>
        </button>
      </form>
      <div class="dock-foot">
        <label class="live-switch" title="Words appear as you speak">
          <input type="checkbox" id="live-toggle"> <span data-t="live_mode"></span>
        </label>
        <p id="talk-label" class="mic-label" data-t="speak"></p>
      </div>
    </div>
  </section>

  <aside id="rail" class="rail" aria-label="Your pickups and today's prices">
    <div class="rail-head">
      <h2 data-t="my_pickups"></h2>
      <button type="button" id="close-rail" class="close" aria-label="Close">×</button>
    </div>
    <section class="rail-block">
      <div id="pickups" class="pickups"></div>
    </section>
    <section class="rail-block skip">
      <h3 data-t="skip_title"></h3>
      <ul>
        <li data-t="skip_1"></li><li data-t="skip_2"></li><li data-t="skip_3"></li><li data-t="skip_4"></li><li data-t="skip_5"></li>
      </ul>
    </section>
    <section class="rail-block">
      <h3 data-t="prices_title"></h3>
      <div id="prices" class="prices"></div>
      <p class="hint" data-t="prices_note"></p>
    </section>
    <section class="rail-block">
      <h3 data-t="how_title"></h3>
      <ol class="how"><li data-t="how_1"></li><li data-t="how_2"></li><li data-t="how_3"></li><li data-t="how_4"></li></ol>
    </section>
    <section class="rail-block">
      <h3 data-t="prove"></h3>
      <p class="hint" data-t="prove_help"></p>
      <label class="btn quiet small" for="proof-photo"><span data-t="prove_send"></span>
        <input type="file" id="proof-photo" accept="image/*" capture="environment" hidden></label>
      <p id="proof-result" class="result" aria-live="polite"></p>
    </section>
    <p class="footnote" data-t="simulated_payment"></p>
  </aside>
</main>

<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
<audio id="voice" hidden></audio>

<script src="../config.js"></script>
<script src="i18n.js"></script>
<script src="kisan.js"></script>
</body>
</html>
